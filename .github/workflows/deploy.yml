name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Lets a secrets-only change (e.g. adding a new repo secret with no code
  # change) trigger a fresh deploy from the Actions tab, without needing a
  # throwaway commit just to re-run the push trigger.
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-flight older one
# instead of racing it, since both would otherwise deploy the same Worker.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler/miniflare/@cloudflare/kv-asset-handler all require Node >=22
      # (confirmed by a real CI failure on Node 20: "Wrangler requires at
      # least Node.js v22.0.0") — this isn't about what Next.js itself needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Applies any new schema migrations to Neon before the new code that
      # depends on them goes live. Uses CI's own direct DB connection —
      # separate from the DATABASE_URL secret set on the Cloudflare Worker
      # itself (Part C of the deploy plan), which is for server runtime, not
      # migrations.
      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time
      # by Next.js itself, so they must be present here — setting them as a
      # Cloudflare Worker secret afterward would be too late, they'd never
      # reach the client bundle. CLERK_SECRET_KEY/ADMIN_EMAIL are server-only
      # and deliberately NOT set here — they live as Cloudflare Worker
      # secrets instead (see Part C of the deploy plan), since OpenNext's
      # Cloudflare adapter copies Worker secrets into process.env at request
      # time, so the deployed server code reads them the same way local dev
      # reads .env.local.
      #
      # DATABASE_URL IS needed here too, even though every route that reads
      # it is server-rendered on demand (not statically prerendered) — real
      # CI failure confirmed this: Next's build still evaluates every route
      # module (including dynamic ones) during its "collect page data" pass
      # to read exports like `generateStaticParams`/`dynamic`, and `db/index.ts`
      # throws eagerly at module-evaluation time if `DATABASE_URL` is unset.
      # Without this, admin/products/[id]/edit fails "Failed to collect page
      # data," `cf:deploy` exits non-zero, and the live Worker silently keeps
      # serving the previous successful deploy — no error surfaces anywhere
      # except this workflow's own failed run, so a build-breaking change can
      # look like nothing happened at all on the live site.
      - name: Build and deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Cloud name + API key are NEXT_PUBLIC_ (next-cloudinary's
          # CldUploadWidget reads them client-side to talk to Cloudinary
          # directly) so, like the Clerk key above, they must be inlined at
          # build time here — CLOUDINARY_API_SECRET is the sensitive one and
          # deliberately lives as a Cloudflare Worker secret instead, not here.
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_API_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
